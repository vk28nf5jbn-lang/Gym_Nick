      const A2 = S.active; const e = curEx(); const to = getEx(el.dataset.id); const from = getEx(e.exId);
      const np = EN.adaptPlanned(e.planned, from, to, S.profile.goals, S.profile.experience); delete np.changed;
      const done = e.sets.filter(Boolean).length;
      if (done) {
        // conservar lo registrado y continuar con el nuevo ejercicio por las series restantes
        e.rows = done; e.planned.sets = Math.min(e.planned.sets, done);
        const n = makeLiveExercise({ exId: to.id, sets: Math.max(1, np.sets - done), repMin: np.repMin, repMax: np.repMax, rest: np.rest, rir: np.rir });
        n.replacedFrom = { exId: e.exId, name: e.name };
        A2.exercises.splice(A2.cur + 1, 0, n); A2.cur++;
      } else {
        const n = makeLiveExercise({ exId: to.id, sets: np.sets, repMin: np.repMin, repMax: np.repMax, rest: np.rest, rir: np.rir });
        n.replacedFrom = { exId: e.exId, name: e.name };
        A2.exercises[A2.cur] = n;
      }
      save('active'); closeSheet(); toast('Ejercicio reemplazado solo en esta sesión.'); render();
    },
    workoutMenu() {
      openSheet(() => ({ title: 'Entrenamiento', body: `<div class="list"><button class="item" data-a="pickEx" data-d="-1"><div class="grow t">Agregar ejercicio a la sesión</div></button>
        <button class="item" data-a="moveCur" data-s="-1"><div class="grow t">Mover ejercicio actual antes</div></button><button class="item" data-a="moveCur" data-s="1"><div class="grow t">Mover ejercicio actual después</div></button>
        <button class="item" data-a="discardWorkout"><div class="grow t" style="color:#ff8a8f">Descartar entrenamiento</div></button></div>` }));
    },
    moveCur(el) { const L = S.active.exercises; const i = S.active.cur, j = i + (+el.dataset.s); if (j >= 0 && j < L.length) { [L[i], L[j]] = [L[j], L[i]]; S.active.cur = j; save('active'); } closeSheet(); render(); },
    async discardWorkout() { closeSheet(); if (!(await confirmD('Descartar entrenamiento', 'Se perderán las series de esta sesión. No se guardará en el historial.', 'Descartar', true))) return; S.active = null; await save('active'); releaseWakeLock(); S.ui.tab = 'home'; render(); },
    finishWorkout() { finishWorkout(); },
    closeSummary() { S.ui.summaryId = null; S.ui.tab = 'home'; render(); },
    async saveBwToday() { const v = num(($('#bw-today') || {}).value); if (v == null || v < 30 || v > 300) { toast('Ingresá un peso válido.', 'err'); return; } S.bodyweights.push({ id: uid(), date: Date.now(), kg: v }); await save('bodyweights'); toast('Peso guardado.', 'ok'); },
    timerStart(el) { startTimer(+el.dataset.v); render(); },
    async timerCustom() { const v = await dialog({ title: 'Descanso', text: 'Segundos:', ok: 'Iniciar', input: { mode: 'numeric', value: String(S.settings.defaultRest) } }); const n = num(v); if (n && n > 0 && n <= 1800) { startTimer(Math.round(n)); render(); } },
    timerAdd(el) { const t = S.active.timer; if (t.paused != null) t.paused += +el.dataset.v * 1000; else t.endAt += +el.dataset.v * 1000; t.duration += +el.dataset.v * 1000; save('active'); updateTimerUI(); },
    timerPause() { const t = S.active.timer; if (t.paused != null) { t.endAt = Date.now() + t.paused; t.paused = null; } else { t.paused = Math.max(0, t.endAt - Date.now()); } save('active'); render(); },
    timerReset() { const t = S.active.timer; startTimer(Math.round(t.duration / 1000)); render(); },
    timerStop() { S.active.timer = null; save('active'); render(); },
    // ---- progreso ----
    openWorkout(el) { S.ui.tab = 'progress'; S.ui.openWorkout = el.dataset.id; S.ui.hEdit = null; render(); },
    closeWorkout() { S.ui.openWorkout = null; S.ui.hEdit = null; render(); },
    hEditStart() { const w = S.history.find((x) => x.id === S.ui.openWorkout); S.ui.hEdit = { id: w.id, draft: clone(w) }; render(); },
    hEditCancel() { S.ui.hEdit = null; render(); },
    hDelSet(el) { const e = S.ui.hEdit.draft.exercises[+el.dataset.e]; e.sets.splice(+el.dataset.s, 1); render(); },
    async hEditSave() {
      const H = S.ui.hEdit; const orig = S.history.find((x) => x.id === H.id);
      if (!(await confirmD('Guardar cambios en el historial', 'Vas a modificar registros de un entrenamiento ya realizado. Las series cambiadas quedan marcadas como editadas.', 'Guardar'))) return;
      H.draft.exercises.forEach((e, ei) => e.sets.forEach((s, si) => {
        const o = orig.exercises[ei] && orig.exercises[ei].sets[si];
        s.w = num(s.w) ?? 0; s.r = num(s.r) ?? 0; s.rpe = num(s.rpe);
        if (!o || o.w !== s.w || o.r !== s.r || (o.rpe ?? null) !== (s.rpe ?? null)) s.editedAt = Date.now();
      }));
      H.draft.exercises = H.draft.exercises.filter((e) => e.sets.length);
      H.draft.editedAt = Date.now();
      S.history[S.history.findIndex((x) => x.id === H.id)] = H.draft;
      await save('history'); S.ui.hEdit = null; toast('Historial actualizado.', 'ok'); render();
    },
    async delWorkout(el) {
      if (!(await confirmD('Eliminar entrenamiento', 'Se borrará este entrenamiento del historial y de las estadísticas. Esta acción no se puede deshacer salvo que tengas una copia exportada.', 'Eliminar', true))) return;
      S.history = S.history.filter((w) => w.id !== el.dataset.id); await save('history'); S.ui.openWorkout = null; render();
    },
    async addBw() { const v = num(($('#bw-in') || {}).value); if (v == null || v < 30 || v > 300) { toast('Ingresá un peso válido.', 'err'); return; } S.bodyweights.push({ id: uid(), date: Date.now(), kg: v }); await save('bodyweights'); render(); },
    async delBw(el) { if (!(await confirmD('Eliminar registro', 'Se borrará este registro de peso corporal.', 'Eliminar', true))) return; S.bodyweights = S.bodyweights.filter((b) => b.id !== el.dataset.id); await save('bodyweights'); render(); },
    // ---- asistente ----
    aiQuick(el) { aiSend(el.dataset.v); },
    aiSend() { const t = $('#ai-in'); aiSend(t ? t.value : ''); },
    aiClear() { S.ui.chat = []; render(); },
    aiDiscard(el) { S.ui.chat[+el.dataset.i].proposal.state = 'discarded'; render(); },
    async aiApply(el) {
      const p = S.ui.chat[+el.dataset.i].proposal;
      if (!(await confirmD('Aplicar propuesta', 'Se creará una rutina nueva con la propuesta y quedará activa. La rutina anterior queda guardada y el historial no cambia.', 'Aplicar'))) return;
      const cur = activeRoutine();
      const r = { id: uid(), name: p.name, version: cur ? (cur.version || 1) + 1 : 1, parentId: cur ? cur.id : null, createdAt: Date.now(), updatedAt: Date.now(), source: 'ia', days: clone(p.days) };
      S.routines.push(r); S.settings.activeRoutineId = r.id; await save('routines', 'settings');
      p.state = 'applied'; toast('Propuesta aplicada como nueva versión.', 'ok'); render();
    },
    aiStartSession(el) {
      const p = S.ui.chat[+el.dataset.i].proposal;
      if (S.active) { toast('Ya hay un entrenamiento en curso.', 'err'); return; }
      startWorkout(null, { id: null, name: p.name, exercises: p.exercises }); p.state = 'applied';
    },
    async aiTest() {
      const ai = S.settings.ai;
      if (!ai.endpoint) { toast('Configurá la URL primero.', 'err'); return; }
      try {
        const r = await fetch(ai.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Access-Key': ai.accessKey || '' }, body: JSON.stringify({ system: 'Respondé solo: OK', messages: [{ role: 'user', content: 'ping' }], max_tokens: 10 }) });
        if (r.ok) toast('Conexión correcta.', 'ok'); else toast(`Error ${r.status}: ${(await r.text()).slice(0, 100)}`, 'err');
      } catch (e) { toast('No se pudo conectar: ' + e.message, 'err'); }
    },
    async aiRevoke() { S.settings.ai.consent = false; await save('settings'); toast('Se volverá a pedir consentimiento.'); render(); },
    // ---- ajustes ----
    editProfile() { S.ui.ob = null; obDraft(); S.ui.ob.step = 1; render(); },
    exportJSON() { exportJSON(); },
    exportCSV() { exportCSV(); },
    importJSON() { const f = $('#import-file'); if (f) { f.value = ''; f.click(); } },
    async undoImport() {
      const b = await Store.get('preImportBackup'); if (!b) { toast('No hay restauración para deshacer.'); return; }
      if (!(await confirmD('Deshacer restauración', 'Se vuelven a cargar los datos que tenías antes de la última restauración.', 'Deshacer'))) return;
      const d = b.data; const k = S.settings.ai.accessKey;
      S.profile = d.profile; S.routines = d.routines || []; S.customExercises = d.customExercises || []; S.history = d.history || []; S.active = d.active || null; S.settings = mergeSettings(d.settings); S.settings.ai.accessKey = k; S.bodyweights = d.bodyweights || [];
      await save(...KEYS); await Store.set('preImportBackup', null); S.ui.hasPreImport = false; toast('Restauración deshecha.', 'ok'); render();
    },
    async wipe() {
      if (!(await confirmD('Borrar todos los datos', 'Se eliminan perfil, rutinas, historial, ejercicios propios y ajustes de este iPhone. Te recomendamos exportar una copia antes.', 'Continuar', true))) return;
      const v = await dialog({ title: 'Confirmación final', text: 'Escribí BORRAR para confirmar.', ok: 'Borrar todo', danger: true, input: { value: '' } });
      if ((v || '').trim().toUpperCase() !== 'BORRAR') { toast('No se borró nada.'); return; }
      await Store.set('preImportBackup', exportPayload());
      S.profile = null; S.routines = []; S.customExercises = []; S.history = []; S.active = null; S.settings = clone(DEFAULT_SETTINGS); S.bodyweights = [];
      await save(...KEYS); S.ui = { tab: 'home', rtab: 'list', ptab: 'summary', edit: null, chat: [], aiBusy: false, hasPreImport: true }; releaseWakeLock(); render();
    },
    checkUpdate() { checkForUpdate(true); },
    applyUpdate() { if (swReg && swReg.waiting) swReg.waiting.postMessage({ type: 'SKIP_WAITING' }); },
    // ---- onboarding ----
    obNext() { const O = obDraft(); if (!obValid(O.step, O.d)) return; O.step = Math.min(OB_STEPS.length - 1, O.step + 1); render(); },
    obBack() { const O = obDraft(); if (O.step <= (O.edit ? 1 : 0)) { if (O.edit) { S.ui.ob = null; } else O.step = 0; render(); return; } O.step--; render(); },
    obCancel() { S.ui.ob = null; render(); },
    obGoal(el) { const g = obDraft().d.goals; const i = g.indexOf(el.dataset.v); if (i >= 0) g.splice(i, 1); else if (g.length < 3) g.push(el.dataset.v); else toast('Máximo tres objetivos.'); render(); },
    obSet(el) { obDraft().d[el.dataset.f] = el.dataset.n ? +el.dataset.v : el.dataset.v; render(); },
    obDays(el) { const d = obDraft().d; d.daysPerWeek = +el.dataset.v; d.weekdays = (EN.DEFAULT_WEEKDAYS[d.daysPerWeek] || []).slice(); render(); },
    obWd(el) { const d = obDraft().d; const w = +el.dataset.v; const i = d.weekdays.indexOf(w); if (i >= 0) d.weekdays.splice(i, 1); else if (d.weekdays.length < d.daysPerWeek) d.weekdays.push(w); else toast(`Ya elegiste ${d.daysPerWeek} días. Quitá uno primero.`); d.weekdays.sort(); render(); },
    obToggle(el) { const a = obDraft().d[el.dataset.f]; const i = a.indexOf(el.dataset.v); i >= 0 ? a.splice(i, 1) : a.push(el.dataset.v); render(); },
    obEquipPreset(el) { const d = obDraft().d; d.equipment = { gym: Object.keys(EQUIP), db: ['mancuernas', 'banco', 'peso_corporal'], bw: ['peso_corporal', 'barra_dominadas'] }[el.dataset.v]; render(); },
    obFinish(el) { obFinish(el.dataset.v); }
  };

  document.addEventListener('click', (ev) => {
    unlockAudio();
    const el = ev.target.closest('[data-a]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.a];
    if (fn) { ev.preventDefault(); fn(el, ev); }
  });
  document.addEventListener('input', (ev) => {
    const el = ev.target; const c = el.dataset && el.dataset.c; if (!c) return;
    if (c === 'draft' && S.active) { const e = curEx(); e.drafts = e.drafts || {}; const i = +el.dataset.i; e.drafts[i] = e.drafts[i] || {}; e.drafts[i][el.dataset.f] = el.value; saveActiveSoon(); }
    else if (c === 'ob') { const O = obDraft(); O.d[el.dataset.f] = el.value; const nb = $('[data-a="obNext"]'); if (nb) nb.disabled = !obValid(O.step, O.d); }
    else if (c === 'rName') { S.ui.edit.draft.name = el.value; S.ui.edit.dirty = true; }
    else if (c === 'dayName') { S.ui.edit.draft.days[+el.dataset.d].name = el.value; S.ui.edit.dirty = true; }
    else if (c === 'cx') S.ui.cx[el.dataset.f] = el.value;
    else if (c === 'hEdit') { S.ui.hEdit.draft.exercises[+el.dataset.e].sets[+el.dataset.s][el.dataset.f] = el.value; }
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target; const c = el.dataset && el.dataset.c;
    if (el.id === 'import-file' && el.files && el.files[0]) { importFile(el.files[0]); return; }
    if (!c) return;
    if (c === 'ob') { obDraft().d[el.dataset.f] = el.value; }
    else if (c === 'rx') { const it = S.ui.edit.draft.days[+el.dataset.d].exercises[+el.dataset.i]; const f = el.dataset.f; it[f] = f === 'rir' ? el.value : Math.max(f === 'rest' ? 0 : 1, Math.round(num(el.value) || 0)); S.ui.edit.dirty = true; render(); }
    else if (c === 'dayWd') { S.ui.edit.draft.days[+el.dataset.d].weekday = el.value ? +el.value : null; S.ui.edit.dirty = true; render(); }
    else if (c === 'libQ') { S.ui.libQ = el.value; render(); }
    else if (c === 'obQ') { S.ui.obQ = el.value; render(); }
    else if (c === 'pickQ') { S.ui.pick.q = el.value; renderSheet(); }
    else if (c === 'pickAvail') { S.ui.pick.onlyAvail = el.checked; renderSheet(); }
    else if (c === 'cx') { S.ui.cx[el.dataset.f] = el.value; if (el.dataset.f === 'primary') renderSheet(); }
    else if (c === 'techFlag') { curEx().techFlag = el.checked; save('active'); }
    else if (c === 'set') { const n = num(el.value); if (n != null && n > 0) { S.settings[el.dataset.f] = Math.round(n); save('settings'); } }
    else if (c === 'setB') { S.settings[el.dataset.f] = el.checked; save('settings'); if (el.dataset.f === 'wakeLock') { el.checked ? requestWakeLock() : releaseWakeLock(); } }
    else if (c === 'prog') { const n = num(el.value); if (n != null && n >= 0) { S.settings.progression[el.dataset.f] = n; save('settings'); } }
    else if (c === 'ai') { const f = el.dataset.f; S.settings.ai[f] = el.type === 'checkbox' ? el.checked : (f === 'historyDays' ? Math.max(7, Math.min(180, Math.round(num(el.value) || 30))) : el.value.trim()); save('settings'); if (f === 'enabled') render(); }
    else if (c === 'progEx') { S.ui.progEx = el.value; render(); }
  });
  // Búsquedas en vivo sin perder el foco
  document.addEventListener('keyup', (ev) => {
    const el = ev.target; const c = el.dataset && el.dataset.c;
    if (c === 'pickQ') { S.ui.pick.q = el.value; const pos = el.selectionStart; renderSheet(); const n = $('[data-c="pickQ"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
    if (c === 'libQ' || c === 'obQ') { S.ui[c] = el.value; clearTimeout(document._qT); document._qT = setTimeout(() => { render(); const n = $(`[data-c="${c}"]`); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 250); }
    if (el.id === 'ai-in' && ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) aiSend(el.value);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { requestWakeLock(); updateTimerUI(); }
    else if (S.active) save('active');
  });
  window.addEventListener('pagehide', () => { if (S.active) save('active'); });
  window.addEventListener('online', () => { if (S.ui.tab === 'ai') render(); });
  window.addEventListener('offline', () => { if (S.ui.tab === 'ai') render(); });

  // ======================= Service worker y actualizaciones controladas =======================
  let swReg = null;
  function showUpdateBanner() {
    if ($('#upd')) return;
    const b = document.createElement('div');
    b.id = 'upd'; b.className = 'toast'; b.style.top = 'calc(env(safe-area-inset-top, 0px) + 10px)';
    b.innerHTML = `Hay una versión nueva. <button class="btn sm primary" data-a="applyUpdate" style="margin-left:8px">Actualizar</button>`;
    document.body.appendChild(b);
  }
  async function checkForUpdate(manual) {
    if (!swReg) { if (manual) toast('Las actualizaciones automáticas requieren la app instalada desde una dirección https.'); return; }
    try { await swReg.update(); } catch (e) { if (manual) toast('No se pudo buscar actualizaciones (¿sin conexión?).', 'err'); return; }
    if (swReg.waiting) showUpdateBanner(); else if (manual) setTimeout(() => { if (swReg.waiting) showUpdateBanner(); else toast('Tenés la última versión.', 'ok'); }, 1500);
  }
  function registerSW() {
    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      swReg = reg;
      if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner();
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(); });
      });
    }).catch(() => { /* sin SW: la app funciona igual mientras haya conexión */ });
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; if (S.active) save('active'); location.reload(); });
  }

  // ======================= Inicio =======================
  async function init() {
    await Store.open();
    const vals = await Promise.all(KEYS.map((k) => Store.get(k)));
    KEYS.forEach((k, i) => { if (vals[i] !== undefined && vals[i] !== null) S[k] = vals[i]; });
    S.settings = mergeSettings(S.settings);
    S.routines = S.routines || []; S.history = S.history || []; S.customExercises = S.customExercises || []; S.bodyweights = S.bodyweights || [];
    S.ui.hasPreImport = !!(await Store.get('preImportBackup'));
    if (S.active) { S.ui.tab = 'train'; S.ui.recovered = true; requestWakeLock(); }
    render();
    if (S.active && S.ui.recovered) toast('Entrenamiento en curso recuperado.', 'ok');
    setInterval(updateTimerUI, 250);
    setInterval(() => { if (S.active) { const el = $('#elapsed'); if (el) el.textContent = fmtDur(Date.now() - S.active.startedAt); } }, 15000);
    registerSW();
    refreshStorageInfo();
  }
  // Exponer para pruebas automatizadas
  globalThis.__GYM = { S, A, Store, render, init, version: APP_VERSION, exportPayload, sanitizeProposal, aiContext };
  if (!globalThis.__GYM_NO_AUTOSTART) init();
})();


  </script>
