<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10151c">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Coach">
  <meta name="format-detection" content="telephone=no">
  <title>Gym Coach</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <!-- Pantalla de arranque para iPhone 16 Pro Max (440×956 pt, @3x) -->
  <link rel="apple-touch-startup-image" href="./splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <!-- iPhone 15/16 Pro Max y Plus (430×932 pt) -->
  <link rel="apple-touch-startup-image" href="./splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <style>
/* Personal Gym Coach — estilos. Paleta inspirada en discos olímpicos sobre grafito. */
:root {
  --bg: #10151c;
  --surface: #18202a;
  --surface-2: #212b37;
  --line: #2c3846;
  --text: #eef2f6;
  --muted: #93a0b0;
  --accent: #f5c518;      /* disco amarillo */
  --accent-ink: #1a1400;
  --info: #4c8dff;        /* disco azul */
  --danger: #f0474e;      /* disco rojo */
  --ok: #34c38f;          /* disco verde */
  --radius-l: 22px;
  --radius-m: 14px;
  --radius-s: 10px;
  --num: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --tabbar-h: 64px;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
}
*, *::before, *::after { box-sizing: inherit; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 40; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Estructura ---------- */
#app { min-height: 100vh; }
.screen {
  padding: 12px 16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom, 0px));
  max-width: 640px; margin: 0 auto;
}
.screen.has-dock { padding-bottom: calc(var(--tabbar-h) + 150px + env(safe-area-inset-bottom, 0px)); }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 52px; margin-bottom: 6px; }
.topbar h1 { font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -0.02em; font-weight: 800; flex: 1; }
.topbar h2 { font-size: 20px; margin: 0; flex: 1; font-weight: 700; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
h3 { font-size: 17px; margin: 22px 0 10px; font-weight: 700; }
h4 { font-size: 15px; margin: 14px 0 8px; font-weight: 650; color: var(--muted); }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 10px; }
.hide { display: none !important; }
.right { text-align: right; }

/* ---------- Tarjetas ---------- */
.card { background: var(--surface); border-radius: var(--radius-l); padding: 16px; margin-bottom: 12px; }
.card.flat { background: transparent; border: 1px solid var(--line); }
.card.tight { padding: 12px 14px; border-radius: var(--radius-m); }
.list { background: var(--surface); border-radius: var(--radius-l); overflow: hidden; margin-bottom: 12px; }
.item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); min-height: 56px; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.item:last-child { border-bottom: 0; }
.item .t { font-weight: 600; }
.item .d { color: var(--muted); font-size: 13px; }
.chev { color: var(--muted); font-size: 20px; }

/* Hero del próximo entrenamiento: el elemento memorable */
.hero {
  position: relative; overflow: hidden; border-radius: 26px; padding: 20px 18px 18px;
  background: linear-gradient(160deg, #1d2734 0%, #151c25 100%); margin-bottom: 14px; border: 1px solid #263242;
}
.hero::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 190px; height: 190px; border-radius: 50%;
  border: 18px solid var(--accent); opacity: .16;
  box-shadow: inset 0 0 0 22px rgba(245,197,24,.08);
}
.hero .when { color: var(--accent); font-weight: 700; font-size: 14px; }
.hero .title { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin: 4px 0 6px; }
.hero ul { margin: 10px 0 16px; padding: 0; list-style: none; color: var(--muted); font-size: 14px; }
.hero li { padding: 3px 0; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px;
  padding: 0 18px; border-radius: 14px; border: 0; background: var(--surface-2); color: var(--text);
  font-weight: 650; font-size: 16px; text-decoration: none; transition: transform .08s ease;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: rgba(240,71,78,.14); color: #ff8a8f; }
.btn.ok { background: var(--ok); color: #04261a; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.link { background: none; min-height: 40px; padding: 0 6px; color: var(--accent); }
.btn.block { width: 100%; }
.btn.big { min-height: 60px; font-size: 18px; border-radius: 18px; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 11px; }
.btn.icon { width: 44px; min-height: 44px; padding: 0; border-radius: 12px; font-size: 18px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btns > .btn { flex: 1; }

/* ---------- Chips y segmentos ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px;
  font-size: 15px; min-height: 40px; font-weight: 550;
}
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip .ord { font-family: var(--num); font-weight: 800; margin-right: 4px; }
.seg { display: flex; background: var(--surface); border-radius: 13px; padding: 4px; gap: 4px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 10px; min-height: 38px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--surface-2); color: var(--text); }
.tag { display: inline-block; font-size: 12px; font-weight: 650; padding: 3px 8px; border-radius: 7px; background: var(--surface-2); color: var(--muted); }
.tag.accent { background: rgba(245,197,24,.16); color: var(--accent); }
.tag.ok { background: rgba(52,195,143,.16); color: var(--ok); }
.tag.info { background: rgba(76,141,255,.16); color: #8db5ff; }
.tag.danger { background: rgba(240,71,78,.16); color: #ff8a8f; }

/* ---------- Formularios ---------- */
label.f { display: block; margin-bottom: 14px; }
label.f > span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; font-weight: 550; }
.input, select.input, textarea.input {
  width: 100%; min-height: 50px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface);
  padding: 12px 14px; font-size: 17px; outline: none; -webkit-appearance: none; appearance: none;
}
textarea.input { min-height: 90px; resize: vertical; }
.input:focus { border-color: var(--accent); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.switch input { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; border-radius: 16px; background: var(--surface-2); position: relative; flex: none; border: 1px solid var(--line); }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #c8d0da; transition: left .15s; }
.switch input:checked { background: var(--ok); border-color: var(--ok); }
.switch input:checked::after { left: 23px; background: #fff; }
.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 11px; }
.stepper button { width: 34px; height: 36px; border: 0; background: none; font-size: 18px; color: var(--muted); }
.stepper input { width: 42px; text-align: center; border: 0; background: none; font-family: var(--num); font-weight: 700; font-size: 16px; padding: 0; height: 36px; }

/* ---------- Barra de pestañas ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(6, 1fr);
  background: rgba(16,21,28,.86); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar button { border: 0; background: none; height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 10.5px; font-weight: 600; position: relative; }
.tabbar button svg { width: 25px; height: 25px; }
.tabbar button.on { color: var(--accent); }
.tabbar .dot { position: absolute; top: 9px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }

/* ---------- Entrenamiento en vivo ---------- */
.live-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.live-head .clock { font-family: var(--num); font-size: 15px; color: var(--muted); }
.ex-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin: 0 -16px 12px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.ex-strip::-webkit-scrollbar { display: none; }
.ex-pill { flex: none; max-width: 170px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 11px; text-align: left; }
.ex-pill .n { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.ex-pill .c { font-family: var(--num); font-size: 12px; color: var(--muted); }
.ex-pill.on { border-color: var(--accent); }
.ex-pill.done .c { color: var(--ok); }
.ex-name { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; margin: 2px 0 8px; }
.targets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.target { background: var(--surface-2); border-radius: 12px; padding: 8px 12px; }
.target b { font-family: var(--num); font-size: 18px; display: block; line-height: 1.1; }
.target small { color: var(--muted); font-size: 12px; }
.last { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
.last b { color: var(--text); font-family: var(--num); }
.sug { border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; background: rgba(76,141,255,.10); border: 1px solid rgba(76,141,255,.35); }
.sug.increase { background: rgba(52,195,143,.09); border-color: rgba(52,195,143,.4); }
.sug.decrease { background: rgba(240,71,78,.08); border-color: rgba(240,71,78,.35); }
.sug .h { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.sug p { font-size: 14px; color: #c9d3de; }

.sets { display: grid; gap: 8px; margin-bottom: 12px; }
.set { display: grid; grid-template-columns: 30px 1fr 1fr 64px 56px; gap: 8px; align-items: center; background: var(--surface); border-radius: 16px; padding: 10px; border: 1px solid transparent; }
.set.no-rpe { grid-template-columns: 30px 1fr 1fr 56px; }
.set .idx { font-family: var(--num); font-weight: 800; font-size: 18px; color: var(--muted); text-align: center; }
.set .cell { display: flex; flex-direction: column; }
.set .cell small { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.set input, .set select { width: 100%; height: 48px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); text-align: center; font-family: var(--num); font-size: 21px; font-weight: 700; padding: 0 4px; -webkit-appearance: none; appearance: none; }
.set select { font-size: 16px; }
.set input:focus { border-color: var(--accent); outline: none; }
.set .go { height: 48px; border-radius: 12px; border: 0; background: var(--surface-2); color: var(--text); font-size: 22px; font-weight: 800; }
.set.next .go { background: var(--accent); color: var(--accent-ink); }
.set.next { border-color: rgba(245,197,24,.35); }
.set.done { background: rgba(52,195,143,.08); border-color: rgba(52,195,143,.25); }
.set.done .go { background: rgba(52,195,143,.2); color: var(--ok); font-size: 16px; }
.set .val { font-family: var(--num); font-size: 21px; font-weight: 700; }
.set .plan { grid-column: 2 / -1; font-size: 12px; color: var(--muted); margin-top: -2px; }
.set.extra .idx { color: var(--info); }

/* Dock del temporizador */
.dock {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); z-index: 25;
  padding: 8px 12px 10px; background: rgba(24,32,42,.94); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
}
.dock .bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
.dock .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
.dock .time { font-family: var(--num); font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; min-width: 120px; }
.dock.ended .time { color: var(--ok); }
.dock.ended { animation: pulse 1s ease 3; }
@keyframes pulse { 50% { background: rgba(52,195,143,.25); } }
.dock .presets { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.dock .presets button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 40px; padding: 0 12px; font-family: var(--num); font-weight: 700; }
.mini-timer { position: fixed; right: 14px; bottom: calc(var(--tabbar-h) + 12px + env(safe-area-inset-bottom, 0px)); z-index: 25; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 10px 16px; font-family: var(--num); font-weight: 800; font-size: 18px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }

/* ---------- Hoja inferior y diálogos ---------- */
.overlay { position: fixed; inset: 0; background: rgba(4,7,10,.6); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0;
  padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); animation: up .2s ease;
}
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
.sheet .sh { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; position: sticky; top: -10px; background: var(--surface); padding: 6px 0; z-index: 2; }
.sheet .sh h2 { flex: 1; font-size: 20px; margin: 0; }
.sheet .list, .sheet .card { background: var(--surface-2); }
.sheet .item { border-color: #34414f; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
.dialog-wrap { position: fixed; inset: 0; z-index: 60; background: rgba(4,7,10,.7); display: flex; align-items: center; justify-content: center; padding: 24px; }
.dialog { background: var(--surface-2); border-radius: 22px; padding: 20px; width: 100%; max-width: 380px; }
.dialog h3 { margin: 0 0 8px; }
.dialog p { color: #c9d3de; font-size: 15px; white-space: pre-line; }
.dialog .btns { margin-top: 16px; }

/* ---------- Toast y banners ---------- */
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 80; background: var(--surface-2); border: 1px solid var(--line); padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 15px; max-width: 92vw; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.toast.ok { border-color: var(--ok); }
.toast.err { border-color: var(--danger); }
.banner { border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; background: rgba(245,197,24,.1); border: 1px solid rgba(245,197,24,.35); }
.banner.info { background: rgba(76,141,255,.1); border-color: rgba(76,141,255,.35); }
.banner.danger { background: rgba(240,71,78,.1); border-color: rgba(240,71,78,.35); }
.banner b { display: block; margin-bottom: 2px; }

/* ---------- Editor de rutinas ---------- */
.day { background: var(--surface); border-radius: var(--radius-l); padding: 12px; margin-bottom: 14px; }
.day-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.day-head input { flex: 1; font-weight: 700; font-size: 18px; min-height: 44px; }
.day-head select { width: 110px; min-height: 44px; font-size: 15px; }
.rx { background: var(--surface-2); border-radius: 15px; padding: 10px 10px 8px; margin-bottom: 8px; }
.rx .top { display: flex; align-items: flex-start; gap: 8px; }
.rx .nm { flex: 1; font-weight: 650; font-size: 15px; line-height: 1.25; padding-top: 4px; }
.rx .params { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 8px; align-items: center; }
.rx .params label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.rx .tools { display: flex; gap: 4px; }
.rx .tools button { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--surface); color: var(--muted); font-size: 16px; }

/* ---------- Biblioteca ---------- */
.body-map { display: flex; justify-content: center; margin: 4px 0 12px; }
.body-map svg { width: 200px; height: auto; }
.body-map .base { fill: #2a3542; }
.body-map .p { fill: var(--accent); }
.body-map .s { fill: rgba(245,197,24,.42); }

/* ---------- Gráficos ---------- */
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln2 { fill: none; stroke: var(--info); stroke-width: 2; stroke-dasharray: 4 4; }
.chart .pt { fill: var(--accent); }
.chart .bar { fill: var(--accent); }
.chart .bar.dim { fill: #3a4756; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--sans); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 5px; background: var(--accent); }
.legend i.b { background: var(--info); }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.kpi { background: var(--surface); border-radius: 16px; padding: 12px; }
.kpi b { font-family: var(--num); font-size: 22px; display: block; line-height: 1.1; }
.kpi small { color: var(--muted); font-size: 12px; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.t td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
table.t td.n { font-family: var(--num); text-align: right; }
table.t tr:last-child td { border-bottom: 0; }
.up { color: var(--ok); }
.down { color: #ff8a8f; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 12px; }
.week div { text-align: center; padding: 8px 0; border-radius: 12px; background: var(--surface); font-size: 12px; color: var(--muted); }
.week div b { display: block; font-family: var(--num); font-size: 16px; color: var(--text); }
.week div.plan { box-shadow: inset 0 0 0 1px var(--line); }
.week div.done { background: rgba(52,195,143,.16); color: var(--ok); }
.week div.today { box-shadow: inset 0 0 0 2px var(--accent); }

/* ---------- Asistente ---------- */
.chat { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.msg { max-width: 88%; padding: 11px 14px; border-radius: 18px; font-size: 15px; white-space: pre-wrap; line-height: 1.45; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }
.msg.ai { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 6px; }
.msg.sys { align-self: center; background: none; color: var(--muted); font-size: 13px; text-align: center; }
.composer { position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 8px); display: flex; gap: 8px; background: var(--bg); padding-top: 6px; }
.composer textarea { min-height: 50px; max-height: 140px; }
.proposal { background: var(--surface-2); border-radius: 14px; padding: 12px; margin-top: 10px; }
.proposal .add { color: var(--ok); }
.proposal .rem { color: #ff8a8f; text-decoration: line-through; }

/* ---------- Onboarding ---------- */
.ob { padding: 20px 18px calc(30px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.ob .progress { display: flex; gap: 4px; margin-bottom: 22px; }
.ob .progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); }
.ob .progress i.on { background: var(--accent); }
.ob h1 { font-size: 32px; line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 8px; font-weight: 800; }
.ob .body { flex: 1; }
.ob .foot { display: flex; gap: 10px; margin-top: 20px; position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.ob .foot .btn { flex: 1; }
.welcome-mark { width: 84px; height: 84px; border-radius: 50%; border: 14px solid var(--accent); margin: 30px 0 26px; box-shadow: inset 0 0 0 10px rgba(245,197,24,.18); }
.opt { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
.opt.on { border-color: var(--accent); background: rgba(245,197,24,.08); }
.opt b { display: block; font-size: 16px; }
.opt span { color: var(--muted); font-size: 14px; }

/* Splash */
.splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); gap: 18px; }
.splash .welcome-mark { margin: 0; }
.splash p { color: var(--muted); font-weight: 600; }

</style>

  // ======================= Gráficos SVG simples =======================
  function lineChart(points, opts = {}) {
    // points: [{label, y, y2?}]
    if (!points.length) return '';
    const W = 340, H = opts.h || 160, P = { l: 36, r: 10, t: 12, b: 24 };
    const ys = points.flatMap((p) => [p.y, p.y2]).filter((v) => v != null);
    let min = Math.min(...ys), max = Math.max(...ys);
    if (min === max) { min -= 1; max += 1; }
    const pad = (max - min) * 0.1; min -= pad; max += pad;
    const x = (i) => P.l + (points.length === 1 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (points.length - 1));
    const y = (v) => P.t + (H - P.t - P.b) * (1 - (v - min) / (max - min));
    const path = (k) => points.map((p, i) => p[k] == null ? null : `${x(i)},${y(p[k])}`).filter(Boolean).join(' ');
    const grid = [0, 0.5, 1].map((f) => { const v = min + (max - min) * f; return `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${P.l - 4}" y="${y(v) + 4}" text-anchor="end">${fmtN(v, 0)}</text>`; }).join('');
    const lbls = points.length > 1 ? `<text x="${x(0)}" y="${H - 6}" text-anchor="start">${esc(points[0].label)}</text><text x="${x(points.length - 1)}" y="${H - 6}" text-anchor="end">${esc(points[points.length - 1].label)}</text>` : `<text x="${x(0)}" y="${H - 6}" text-anchor="middle">${esc(points[0].label)}</text>`;
    const has2 = points.some((p) => p.y2 != null);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}
      ${has2 ? `<polyline class="ln2" points="${path('y2')}"/>` : ''}
      <polyline class="ln" points="${path('y')}"/>
      ${points.map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.y)}" r="3"/>`).join('')}${lbls}</svg>`;
  }
  function barChart(points, opts = {}) {
    if (!points.length) return '';
    const W = 340, H = opts.h || 140, P = { l: 26, r: 6, t: 10, b: 22 };
    const max = Math.max(1, ...points.map((p) => p.y));
    const bw = (W - P.l - P.r) / points.length;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
      <line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${H - P.b}" y2="${H - P.b}"/>
      <text x="${P.l - 4}" y="${P.t + 8}" text-anchor="end">${fmtN(max, 0)}</text>
      ${points.map((p, i) => { const h = (H - P.t - P.b) * p.y / max; return `<rect class="bar ${p.dim ? 'dim' : ''}" x="${P.l + i * bw + bw * 0.18}" y="${H - P.b - h}" width="${bw * 0.64}" height="${h}" rx="3"/><text x="${P.l + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(p.label)}</text>`; }).join('')}</svg>`;
  }

  // ======================= Rutinas: helpers =======================
  const activeRoutine = () => S.routines.find((r) => r.id === S.settings.activeRoutineId) || null;
  const dayMinutes = (d) => Math.round(EN.estimateDaySeconds(d) / 60);
  function nextDay(r) {
    if (!r || !r.days.length) return null;
    const hist = S.history.filter((w) => w.routineId === r.id).sort((a, b) => b.startedAt - a.startedAt);
    const scheduled = r.days.filter((d) => d.weekday);
    if (scheduled.length) {
      const t = todayWd();
      const doneToday = S.history.some((w) => sameDay(w.startedAt, Date.now()));
      for (let k = 0; k < 7; k++) {
        const wd = ((t - 1 + k) % 7) + 1;
        if (k === 0 && doneToday) continue;
        const d = scheduled.find((x) => x.weekday === wd);
        if (d) return { day: d, label: k === 0 ? 'Hoy' : k === 1 ? 'Mañana' : DAYS[wd] };
      }
    }
    const last = hist[0];
    const idx = last ? (r.days.findIndex((d) => d.id === last.dayId) + 1) % r.days.length : 0;
    return { day: r.days[Math.max(0, idx)], label: 'Siguiente' };
  }
  function newRoutineVersion(src, overrides = {}) {
    const r = clone(src);
    r.id = uid(); r.parentId = src.id; r.version = (src.version || 1) + 1; r.createdAt = Date.now(); r.updatedAt = Date.now();
    r.days.forEach((d) => { d.id = d.id || uid(); d.exercises.forEach((it) => { it.uid = uid(); }); });
    return Object.assign(r, overrides);
  }

    } else {

          <div class="params"><label>Series${stepper(di, i, 'sets', it.sets)}</label><label>Mín ${ex && ex.unit === 's' ? '(s)' : 'reps'}${stepper(di, i, 'repMin', it.repMin)}</label><label>Máx${stepper(di, i, 'repMax', it.repMax)}</label><label>Descanso (s)${stepper(di, i, 'rest', it.rest, 15)}</label>
          <label>RIR<input class="input" style="width:70px;min-height:36px;padding:4px 8px;font-size:15px" value="${esc(it.rir || '')}" data-c="rx" data-d="${di}" data-i="${i}" data-f="rir"></label></div></div>`; }).join('')}
        <div class="btns"><button class="btn sm" data-a="pickEx" data-d="${di}">+ Ejercicio</button><button class="btn sm ghost" data-a="dayMenu" data-d="${di}">Opciones del día</button></div></section>`).join('')}
      <button class="btn block" data-a="addDay">+ Agregar día</button>
      <h3>Volumen semanal programado</h3><div class="card tight"><table class="t"><tr><th>Músculo</th><th class="right">Directas</th><th class="right">Indirectas</th><th class="right">Días</th></tr>
        ${Object.keys(MUSCLES).map((m) => `<tr><td>${MUSCLES[m]}</td><td class="n">${vol[m].direct}</td><td class="n">${fmtN(vol[m].indirect)}</td><td class="n">${vol[m].days}</td></tr>`).join('')}</table>
        <p class="muted small" style="margin-top:8px">Series semanales efectivas de referencia: 10–20 por músculo para hipertrofia en personas entrenadas; menos para mantenimiento. Indirectas = 0,5 por serie donde el músculo es secundario.</p></div>
      ${warns.length ? `<div class="banner"><b>Recuperación</b>${warns.map(esc).join('<br>')}</div>` : ''}
      <div class="btns" style="margin-top:14px"><button class="btn ghost" data-a="closeEditor">Descartar cambios</button><button class="btn primary" data-a="saveEditor">Guardar</button></div>`;
  }

  // Biblioteca
  function renderLibrary() {
    const q = (S.ui.libQ || '').toLowerCase(), m = S.ui.libM || '';
    const list = allExercises().filter((e) => (!m || e.primary === m) && (!q || e.name.toLowerCase().includes(q))).sort((a, b) => a.name.localeCompare(b.name, 'es'));
    return `<input class="input" placeholder="Buscar ejercicio" value="${esc(S.ui.libQ || '')}" data-c="libQ" style="margin-bottom:10px">
      <div class="chips" style="margin-bottom:12px"><button class="chip ${!m ? 'on' : ''}" data-a="libM" data-v="">Todos</button>${Object.keys(MUSCLES).map((k) => `<button class="chip ${m === k ? 'on' : ''}" data-a="libM" data-v="${k}">${MUSCLES[k]}</button>`).join('')}</div>
      <button class="btn block" data-a="customEx" style="margin-bottom:12px">+ Crear ejercicio personalizado</button>
      <div class="list">${list.map((e) => `<button class="item" data-a="exDetail" data-id="${e.id}"><div class="grow"><div class="t">${esc(e.name)}</div><div class="d">${MUSCLES[e.primary]} — ${e.equipment.map((x) => EQUIP[x] || x).join(', ')}${e.custom ? ' — personalizado' : ''}</div></div><span class="chev">›</span></button>`).join('') || '<div class="item muted">Sin resultados</div>'}</div>
      <p class="muted small">${allExercises().length} ejercicios disponibles.</p>`;
  }
  function exDetailSheet(id) {
    const e = getEx(id); if (!e) return { title: 'Ejercicio', body: '<p>No encontrado.</p>' };
    const sc = EN.repScheme(e, (S.profile && S.profile.goals) || ['ganancia'], (S.profile && S.profile.experience) || 'intermedio');
    const alts = EN.alternatives(e, allExercises(), { equipment: S.profile ? S.profile.equipment : Object.keys(EQUIP), limit: 6 });
    return { title: e.name, body: `<div class="body-map">${bodySVG(e.primary, e.secondary)}</div>
      <div class="row wrap" style="gap:6px;margin-bottom:12px"><span class="tag accent">${MUSCLES[e.primary]}</span>${(e.secondary || []).map((m) => `<span class="tag">${MUSCLES[m]}</span>`).join('')}<span class="tag info">${PATTERNS[e.pattern] || e.pattern}</span><span class="tag">${e.type === 'c' ? 'Compuesto' : 'Aislamiento'}</span></div>
      <div class="card"><h4 style="margin-top:0">Equipamiento</h4><p>${e.equipment.map((x) => EQUIP[x] || x).join(', ')}</p>
      <h4>Instrucciones</h4><p>${esc(e.instructions || '—')}</p><h4>Técnica</h4><p>${esc(e.technique || '—')}</p><h4>Errores frecuentes</h4><p>${esc(e.errors || '—')}</p>
      <h4>Orientativo según tu objetivo</h4><p class="num">${sc.repMin}–${sc.repMax} ${e.unit === 's' ? 'segundos' : 'repeticiones'}, descanso ${sc.rest} s, RIR ${sc.rir}</p></div>
      <h4>Alternativas</h4><div class="list">${alts.map((a) => `<button class="item" data-a="exDetail" data-id="${a.ex.id}"><div class="grow"><div class="t">${esc(a.ex.name)}</div><div class="d">${esc(a.reason)}</div></div></button>`).join('') || '<div class="item muted">Sin alternativas con tu equipamiento.</div>'}</div>
      ${e.custom ? `<div class="btns"><button class="btn" data-a="customEx" data-id="${e.id}">Editar</button><button class="btn danger" data-a="delCustomEx" data-id="${e.id}">Eliminar</button></div>` : ''}` };
  }
  function customExSheet(id) {
    const e = id ? getEx(id) : null;
    const d = S.ui.cx || (S.ui.cx = e ? clone(e) : { id: 'custom_' + uid(), name: '', primary: 'pecho', secondary: [], equipment: [], pattern: 'aislamiento', type: 'i', level: 1, instructions: '', technique: '', errors: '', unit: 'reps', custom: true });
    return { title: e ? 'Editar ejercicio' : 'Nuevo ejercicio', body: `
      <label class="f"><span>Nombre</span><input class="input" data-c="cx" data-f="name" value="${esc(d.name)}"></label>
      <label class="f"><span>Grupo muscular principal</span><select class="input" data-c="cx" data-f="primary">${Object.keys(MUSCLES).map((k) => `<option value="${k}" ${d.primary === k ? 'selected' : ''}>${MUSCLES[k]}</option>`).join('')}</select></label>
      <h4>Músculos secundarios</h4><div class="chips">${Object.keys(MUSCLES).filter((k) => k !== d.primary).map((k) => `<button class="chip ${d.secondary.includes(k) ? 'on' : ''}" data-a="cxToggle" data-f="secondary" data-v="${k}">${MUSCLES[k]}</button>`).join('')}</div>
      <h4>Equipamiento</h4><div class="chips">${Object.keys(EQUIP).map((k) => `<button class="chip ${d.equipment.includes(k) ? 'on' : ''}" data-a="cxToggle" data-f="equipment" data-v="${k}">${EQUIP[k]}</button>`).join('')}</div>
      <div class="row" style="margin-top:14px"><label class="f grow"><span>Tipo</span><select class="input" data-c="cx" data-f="type"><option value="c" ${d.type === 'c' ? 'selected' : ''}>Compuesto</option><option value="i" ${d.type === 'i' ? 'selected' : ''}>Aislamiento</option></select></label>
      <label class="f grow"><span>Patrón</span><select class="input" data-c="cx" data-f="pattern">${Object.keys(PATTERNS).map((k) => `<option value="${k}" ${d.pattern === k ? 'selected' : ''}>${PATTERNS[k]}</option>`).join('')}</select></label></div>
      <div class="row"><label class="f grow"><span>Medida</span><select class="input" data-c="cx" data-f="unit"><option value="reps" ${d.unit !== 's' ? 'selected' : ''}>Repeticiones</option><option value="s" ${d.unit === 's' ? 'selected' : ''}>Segundos</option></select></label>
      <label class="f grow"><span>Dificultad</span><select class="input" data-c="cx" data-f="level">${[1, 2, 3].map((l) => `<option value="${l}" ${+d.level === l ? 'selected' : ''}>${['', 'Básica', 'Intermedia', 'Avanzada'][l]}</option>`).join('')}</select></label></div>
      <label class="f"><span>Instrucciones</span><textarea class="input" data-c="cx" data-f="instructions">${esc(d.instructions)}</textarea></label>
      <label class="f"><span>Técnica</span><textarea class="input" data-c="cx" data-f="technique">${esc(d.technique)}</textarea></label>
      <label class="f"><span>Errores frecuentes</span><textarea class="input" data-c="cx" data-f="errors">${esc(d.errors)}</textarea></label>
      <button class="btn primary block" data-a="saveCustomEx">Guardar ejercicio</button>` };
  }
  function pickerSheet() {
    const P = S.ui.pick; const q = (P.q || '').toLowerCase();
    const eq = S.profile ? S.profile.equipment : Object.keys(EQUIP);
    let list = allExercises().filter((e) => (!P.m || e.primary === P.m) && (!q || e.name.toLowerCase().includes(q)));
    if (P.onlyAvail) list = list.filter((e) => EN.exAvailable(e, eq));
    list.sort((a, b) => a.name.localeCompare(b.name, 'es'));
    return { title: 'Agregar ejercicio', body: `<input class="input" placeholder="Buscar" value="${esc(P.q || '')}" data-c="pickQ" style="margin-bottom:10px">
      <div class="chips" style="margin-bottom:10px"><button class="chip ${!P.m ? 'on' : ''}" data-a="pickM" data-v="">Todos</button>${Object.keys(MUSCLES).map((k) => `<button class="chip ${P.m === k ? 'on' : ''}" data-a="pickM" data-v="${k}">${MUSCLES[k]}</button>`).join('')}</div>
      <label class="switch"><span>Solo con mi equipamiento</span><input type="checkbox" data-c="pickAvail" ${P.onlyAvail ? 'checked' : ''}></label>
      <div class="list">${list.map((e) => `<button class="item" data-a="pickDo" data-id="${e.id}"><div class="grow"><div class="t">${esc(e.name)}</div><div class="d">${MUSCLES[e.primary]} — ${e.equipment.map((x) => EQUIP[x] || x).join(', ')}</div></div><span class="chev">+</span></button>`).join('') || '<div class="item muted">Sin resultados</div>'}</div>` };
  }

  // ======================= ENTRENAR =======================
  function scrTrain() {
    if (S.ui.summaryId) return scrSummary(S.ui.summaryId);
    if (!S.active) {
      const r = activeRoutine(); const nd = nextDay(r);
      return `<div class="topbar"><h1>Entrenar</h1></div>
        ${r ? `<p class="sub">${esc(r.name)}</p><div class="list">${r.days.map((d) => `<button class="item" data-a="startDay" data-r="${r.id}" data-d="${d.id}" ${d.exercises.length ? '' : 'disabled'}><div class="grow"><div class="t">${esc(d.name)} ${nd && nd.day.id === d.id ? '<span class="tag accent">Próximo</span>' : ''}</div><div class="d">${d.weekday ? DAYS[d.weekday] + ' — ' : ''}${d.exercises.length} ejercicios, unos ${dayMinutes(d)} min</div></div><span class="chev">›</span></button>`).join('')}</div>`
        : '<div class="card flat"><p>No hay una rutina activa.</p><button class="btn primary" data-a="tab" data-v="routines">Ir a rutinas</button></div>'}
        <button class="btn block ghost" data-a="startFree">Entrenamiento libre (sin rutina)</button>`;
    }
    const A = S.active;
    const cur = Math.min(A.cur || 0, Math.max(0, A.exercises.length - 1));
    const e = A.exercises[cur];
    const strip = A.exercises.map((x, i) => {
      const d = x.sets.filter(Boolean).length;
      return `<button class="ex-pill ${i === cur ? 'on' : ''} ${d >= x.rows ? 'done' : ''}" data-a="goEx" data-i="${i}"><span class="n">${esc(x.name)}</span><span class="c">${d}/${x.rows}</span></button>`;
    }).join('');
    return `<div class="live-head"><div class="grow"><div style="font-weight:800;font-size:20px">${esc(A.dayName)}</div><div class="clock">Inicio ${fmtTime(A.startedAt)} — <span id="elapsed">${fmtDur(Date.now() - A.startedAt)}</span></div></div>
      <button class="btn sm ghost" data-a="workoutMenu">Opciones</button><button class="btn sm primary" data-a="finishWorkout">Finalizar</button></div>
      <div class="ex-strip">${strip}<button class="ex-pill" data-a="pickEx" data-d="-1"><span class="n">+ Ejercicio</span><span class="c">agregar</span></button></div>
      ${e ? renderLiveExercise(e, cur) : '<div class="card flat"><p>Esta sesión no tiene ejercicios. Agregá uno para empezar.</p></div>'}`;
  }

  function lastFor(e) {
    const sess = EN.exerciseSessions(e.exId, S.history, 1)[0];
    return sess || null;
  }
  function renderLiveExercise(e, idx) {
    const ex = getEx(e.exId) || { unit: e.unit, primary: e.primary };
    const unit = ex.unit === 's' ? 's' : 'reps';
    const last = lastFor(e);
    const P = e.planned;
    const sug = e.suggestion;
    const nextIdx = (() => { for (let i = 0; i < e.rows; i++) if (!e.sets[i]) return i; return -1; })();
    const logRpe = S.settings.logRpe;
    const rows = [];
    for (let i = 0; i < e.rows; i++) {
      const s = e.sets[i]; const editing = e.editing && e.editing[i];
      const extra = i >= P.sets;
      const prev = last && last.sets[i] ? `${fmtN(last.sets[i].w)} kg × ${last.sets[i].r}` : '—';
      const plan = extra ? `Serie extra — anterior: ${prev}` : `Programada: ${P.repMin}–${P.repMax} ${unit} — anterior: ${prev}`;
      if (s && !editing) {
        rows.push(`<div class="set done ${logRpe ? '' : 'no-rpe'} ${extra ? 'extra' : ''}"><div class="idx">${i + 1}</div><div class="cell"><small>kg</small><span class="val">${fmtN(s.w)}</span></div><div class="cell"><small>${unit}</small><span class="val">${s.r}</span></div>${logRpe ? `<div class="cell"><small>RPE</small><span class="val">${s.rpe ?? '–'}</span></div>` : ''}<button class="go" data-a="editSet" data-i="${i}" aria-label="Editar serie">Editar</button><div class="plan">Realizada${s.editedAt ? ' (editada)' : ''} — ${plan}</div></div>`);
      } else {
        const dr = (e.drafts && e.drafts[i]) || {};
        const wDef = dr.w ?? (s ? s.w : defaultWeight(e, i, last));
        const rDef = dr.r ?? (s ? s.r : '');
        const rpeDef = dr.rpe ?? (s ? s.rpe : '');
        rows.push(`<div class="set ${i === nextIdx || editing ? 'next' : ''} ${logRpe ? '' : 'no-rpe'} ${extra ? 'extra' : ''}" data-row="${i}"><div class="idx">${i + 1}</div>
          <div class="cell"><small>kg</small><input inputmode="decimal" data-c="draft" data-f="w" data-i="${i}" value="${wDef ?? ''}" placeholder="0" aria-label="Peso serie ${i + 1}"></div>
          <div class="cell"><small>${unit}</small><input inputmode="numeric" data-c="draft" data-f="r" data-i="${i}" value="${rDef ?? ''}" placeholder="${P.repMax}" aria-label="${unit} serie ${i + 1}"></div>
          ${logRpe ? `<div class="cell"><small>RPE</small><select data-c="draft" data-f="rpe" data-i="${i}" aria-label="RPE"><option value="">–</option>${[6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10].map((v) => `<option ${+rpeDef === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>` : ''}
          <button class="go" data-a="confirmSet" data-i="${i}" aria-label="Confirmar serie">✓</button><div class="plan">${editing ? 'Editando serie registrada — ' : ''}${plan}</div></div>`);
      }
    }
    const sugBox = sug && sug.type !== 'none' ? `<div class="sug ${sug.type}"><div class="h">${sug.type === 'increase' ? 'Sugerencia: subir' : sug.type === 'decrease' ? 'Sugerencia: bajar' : 'Sugerencia: mantener'}${sug.weight ? ` — ${fmtN(sug.weight, 2)} kg` : ''}</div><p>${esc(sug.reason)}</p>
      ${e.sugDecision ? `<div class="small muted">${e.sugDecision === 'accepted' ? 'Aceptada' : e.sugDecision === 'rejected' ? 'Rechazada' : 'Modificada a ' + fmtN(e.sugWeight, 2) + ' kg'} <button class="btn link sm" data-a="sugReset">Cambiar</button></div>`
        : `<div class="btns" style="margin-top:8px"><button class="btn sm ok" data-a="sugAccept">Aceptar</button><button class="btn sm" data-a="sugModify">Modificar</button><button class="btn sm ghost" data-a="sugReject">Rechazar</button></div>`}</div>`
      : '';
    return `<div class="ex-name">${esc(e.name)}</div>
      ${e.replacedFrom ? `<div class="small muted" style="margin:-4px 0 8px">Reemplaza a ${esc(e.replacedFrom.name)}</div>` : ''}
      <div class="targets"><div class="target"><b>${P.sets}</b><small>series</small></div><div class="target"><b>${P.repMin}–${P.repMax}</b><small>${unit}</small></div><div class="target"><b>${P.rest}s</b><small>descanso</small></div>${P.rir ? `<div class="target"><b>${esc(P.rir)}</b><small>RIR</small></div>` : ''}</div>
      <div class="last">${last ? `Última vez (${fmtShort(last.date)}): <b>${last.sets.map((s) => fmtN(s.w) + '×' + s.r).join('  ')}</b>` : 'Sin registros anteriores. Elegí una carga con la que completes el rango dejando 2–3 repeticiones en reserva.'}</div>
      ${sugBox}
      <div class="sets">${rows.join('')}</div>
      <div class="btns" style="margin-bottom:10px"><button class="btn sm" data-a="addRow">+ Serie</button>${e.rows > Math.max(e.sets.filter(Boolean).length, 1) && !e.sets[e.rows - 1] ? '<button class="btn sm ghost" data-a="delRow">− Serie</button>' : ''}<button class="btn sm" data-a="altEx" data-busy="0">Alternativa</button><button class="btn sm" data-a="altEx" data-busy="1">Máquina ocupada</button></div>
      <label class="switch card tight"><span><b style="font-size:15px">Técnica comprometida o molestias</b><br><span class="muted small">Si lo marcás, la próxima vez no se sugerirá subir la carga.</span></span><input type="checkbox" data-c="techFlag" ${e.techFlag ? 'checked' : ''}></label>
      <div class="btns"><button class="btn ghost" data-a="exDetail" data-id="${e.exId}">Ver técnica</button><button class="btn ghost" data-a="goEx" data-i="${idx - 1}" ${idx === 0 ? 'disabled' : ''}>‹ Anterior</button><button class="btn ghost" data-a="goEx" data-i="${idx + 1}" ${idx >= S.active.exercises.length - 1 ? 'disabled' : ''}>Siguiente ›</button></div>`;
  }
  function defaultWeight(e, i, last) {
    if (e.sugDecision === 'accepted' && e.suggestion && e.suggestion.weight != null) return e.suggestion.weight;
    if (e.sugDecision === 'modified' && e.sugWeight != null) return e.sugWeight;
    const prevSet = e.sets.slice(0, i).filter(Boolean).pop();
    if (prevSet) return prevSet.w;
    if (last && last.sets[i]) return last.sets[i].w;
    if (last && last.sets.length) return last.sets[last.sets.length - 1].w;
    return '';
  }

  function makeLiveExercise(it, routineDay) {
    const ex = getEx(it.exId);
    const planned = { sets: it.sets, repMin: it.repMin, repMax: it.repMax, rest: it.rest || S.settings.defaultRest, rir: it.rir || '' };
    const sug = ex ? EN.suggestProgression(ex, planned, S.history, S.settings.progression) : null;
    return { uid: uid(), exId: it.exId, name: ex ? ex.name : 'Ejercicio', primary: ex ? ex.primary : null, unit: ex ? ex.unit : 'reps', planned, rows: planned.sets, sets: [], drafts: {}, editing: {}, techFlag: false, replacedFrom: null, suggestion: sug, sugDecision: null, sugWeight: null };
  }
  function startWorkout(routine, day) {
    S.active = {
      id: uid(), routineId: routine ? routine.id : null, routineName: routine ? routine.name : 'Entrenamiento libre', routineVersion: routine ? (routine.version || 1) : null,
      dayId: day ? day.id : null, dayName: day ? day.name : 'Entrenamiento libre', startedAt: Date.now(), cur: 0, timer: null,
      exercises: day ? day.exercises.map((it) => makeLiveExercise(it)) : []
    };
    save('active'); S.ui.tab = 'train'; S.ui.summaryId = null; requestWakeLock(); render();
  }

  // ---------- Temporizador ----------
  function renderDock() {
    const t = S.active && S.active.timer;
    const presets = [45, 60, 90, 120, 180];
    if (!t) {
      return `<div class="dock" id="dock"><div class="row"><span class="muted small" style="flex:none">Descanso</span><div class="presets grow">${presets.map((p) => `<button data-a="timerStart" data-v="${p}">${clock(p)}</button>`).join('')}<button data-a="timerCustom">Otro</button></div></div></div>`;
    }
    return `<div class="dock ${t.done ? 'ended' : ''}" id="dock"><div class="bar"><i id="tmr-bar"></i></div><div class="row"><div class="time" id="tmr-time">${clock(timerRemaining() / 1000)}</div>
      <div class="grow btns" style="gap:6px;justify-content:flex-end">${t.done ? '' : `<button class="btn sm" data-a="timerAdd" data-v="15">+15</button><button class="btn sm" data-a="timerPause">${t.paused != null ? 'Seguir' : 'Pausa'}</button>`}<button class="btn sm" data-a="timerReset">Reiniciar</button><button class="btn sm ${t.done ? 'primary' : 'ghost'}" data-a="timerStop">${t.done ? 'Listo' : 'Terminar'}</button></div></div></div>`;
  }
  function renderMiniTimer() {
    const t = S.active && S.active.timer;
    if (!t || t.done || S.ui.tab === 'train') return '';
    return `<button class="mini-timer" data-a="tab" data-v="train" id="mini-tmr">${clock(timerRemaining() / 1000)}</button>`;
  }
  function timerRemaining() {
    const t = S.active && S.active.timer; if (!t) return 0;
    if (t.paused != null) return t.paused;
    return Math.max(0, t.endAt - Date.now());
  }
  function startTimer(sec) {
    if (!S.active) return;
    S.active.timer = { duration: sec * 1000, endAt: Date.now() + sec * 1000, paused: null, done: false };
    save('active');
  }
  function updateTimerUI() {
    const t = S.active && S.active.timer;
    const el = $('#elapsed'); if (el && S.active) el.textContent = fmtDur(Date.now() - S.active.startedAt);
    if (!t) return;
    const rem = timerRemaining();
    const te = $('#tmr-time'); if (te) te.textContent = clock(rem / 1000);
    const mt = $('#mini-tmr'); if (mt) mt.textContent = clock(rem / 1000);
    const bar = $('#tmr-bar'); if (bar) bar.style.width = (100 * (1 - rem / t.duration)) + '%';
    if (!t.done && t.paused == null && rem <= 0) {
      t.done = true; save('active'); beep();
      if (S.ui.tab === 'train') render(); else { const m = $('#mini-tmr'); if (m) m.remove(); toast('Descanso terminado', 'ok'); }
    }
  }
  let audioCtx = null;
  function unlockAudio() {
    if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
    try { const C = window.AudioContext || window.webkitAudioContext; if (C) { audioCtx = new C(); const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); g.gain.value = 0; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.01); } } catch (e) { /* sin audio */ }
  }
  function beep() {
    if (!S.settings.sound || !audioCtx) return;
    try {
      const t0 = audioCtx.currentTime;
      [0, 0.25, 0.5].forEach((d, k) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = k === 2 ? 1320 : 880; o.type = 'sine';
        g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.4, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.18);
        o.connect(g); g.connect(audioCtx.destination); o.start(t0 + d); o.stop(t0 + d + 0.2);
      });
    } catch (e) { /* ignorar */ }
  }
  let wakeLock = null;
  async function requestWakeLock() {
    if (!S.settings.wakeLock || !S.active || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; }
  }
  function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch (e) { /* */ } wakeLock = null; }

  // ---------- Resumen ----------

  // ======================= PROGRESO =======================
  function scrProgress() {
    const seg = `<div class="seg">${[['summary', 'Resumen'], ['exercise', 'Ejercicios'], ['history', 'Historial'], ['body', 'Peso']].map(([k, l]) => `<button class="${S.ui.ptab === k ? 'on' : ''}" data-a="ptab" data-v="${k}">${l}</button>`).join('')}</div>`;

    let body = '';
    if (S.ui.ptab === 'summary') body = progSummary();
    else if (S.ui.ptab === 'exercise') body = progExercise();
    else if (S.ui.ptab === 'history') body = progHistory();
    else body = progBody();
    return `<div class="topbar"><h1>Progreso</h1></div>${seg}${body}`;
  }
  const noData = (txt) => `<div class="card flat"><p>${txt}</p><p class="muted small">Las estadísticas se calculan solo con entrenamientos registrados.</p></div>`;
  function progSummary() {
    if (!S.history.length) return noData('Todavía no hay entrenamientos registrados.');
    const weeks = EN.weeklyMuscleSets(S.history, getEx, 8);
    const cmp = EN.comparePeriods(S.history, 30);
    const curW = weeks[weeks.length - 1];
    const prev4 = weeks.slice(-5, -1);
    const sessions = S.history.slice().sort((a, b) => a.startedAt - b.startedAt).slice(-12);
    const pct = (a, b) => b ? ((a - b) / b * 100) : null;
    const diff = (a, b, unit = '') => { const p = pct(a, b); return p == null ? '' : `<span class="${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '+' : ''}${fmtN(p, 0)}%</span>`; };
    return `<h3 style="margin-top:4px">Frecuencia (últimas 8 semanas)</h3><div class="card">${barChart(weeks.map((w, i) => ({ label: fmtShort(w.start).split(' ')[0], y: w.sessions, dim: i < weeks.length - 1 })))}<p class="muted small">Sesiones por semana. Promedio: ${fmtN(weeks.reduce((t, w) => t + w.sessions, 0) / weeks.length)}.</p></div>
      <h3>Volumen por sesión</h3><div class="card">${lineChart(sessions.map((w) => ({ label: fmtShort(w.startedAt), y: EN.workoutStats(w).volume })))}<p class="muted small">Kilos totales (peso × repeticiones) de las últimas ${sessions.length} sesiones.</p></div>
      <h3>Series por músculo</h3><div class="card tight"><table class="t"><tr><th>Músculo</th><th class="right">Esta semana</th><th class="right">Prom. 4 sem.</th></tr>
      ${Object.keys(MUSCLES).map((m) => `<tr><td>${MUSCLES[m]}</td><td class="n">${fmtN(curW.sets[m] || 0)}</td><td class="n">${fmtN(prev4.reduce((t, w) => t + (w.sets[m] || 0), 0) / Math.max(1, prev4.length))}</td></tr>`).join('')}</table><p class="muted small" style="margin-top:6px">Incluye 0,5 por serie donde el músculo trabaja como secundario.</p></div>
      <h3>Últimos 30 días contra los 30 anteriores</h3>
      ${cmp.enoughData ? `<div class="card tight"><table class="t"><tr><th></th><th class="right">Actual</th><th class="right">Anterior</th><th class="right">Cambio</th></tr>
        <tr><td>Sesiones</td><td class="n">${cmp.current.sessions}</td><td class="n">${cmp.previous.sessions}</td><td class="n">${diff(cmp.current.sessions, cmp.previous.sessions)}</td></tr>
        <tr><td>Series</td><td class="n">${cmp.current.sets}</td><td class="n">${cmp.previous.sets}</td><td class="n">${diff(cmp.current.sets, cmp.previous.sets)}</td></tr>
        <tr><td>Volumen (kg)</td><td class="n">${fmtN(cmp.current.volume, 0)}</td><td class="n">${fmtN(cmp.previous.volume, 0)}</td><td class="n">${diff(cmp.current.volume, cmp.previous.volume)}</td></tr></table>
        ${cmp.exercises.length ? `<h4>1RM estimado por ejercicio (mejor serie de cada período)</h4><table class="t">${cmp.exercises.slice(0, 8).map((x) => `<tr><td>${esc(x.name)}</td><td class="n">${fmtN(x.prev)} → ${fmtN(x.cur)}</td><td class="n"><span class="${x.diffPct >= 0 ? 'up' : 'down'}">${x.diffPct >= 0 ? '+' : ''}${fmtN(x.diffPct, 1)}%</span></td></tr>`).join('')}</table><p class="muted small">Estimación con la fórmula de Epley sobre series de hasta 12 repeticiones; no es un 1RM medido.</p>` : '<p class="muted small">No hay ejercicios registrados en ambos períodos para comparar.</p>'}</div>`
      : `<div class="card flat"><p class="muted">Hace falta al menos una sesión en cada período para comparar. Actual: ${cmp.current.sessions} sesiones; anterior: ${cmp.previous.sessions}.</p></div>`}

      ${isTime ? '' : `<h3 style="margin-top:4px">Evolución de la carga</h3><div class="card">${lineChart(series.map((p) => ({ label: fmtShort(p.date), y: p.topWeight, y2: p.bestE1rm })))}<div class="legend"><span><i></i>Peso máximo</span><span><i class="b"></i>1RM estimado</span></div></div>`}
      <h3>Evolución de ${isTime ? 'la duración' : 'las repeticiones'}</h3><div class="card">${lineChart(series.map((p) => ({ label: fmtShort(p.date), y: p.maxReps, y2: p.totalReps })))}<div class="legend"><span><i></i>Mejor serie</span><span><i class="b"></i>Total de la sesión</span></div></div>

      ${series.slice().reverse().map((p) => `<tr><td>${fmtShort(p.date)}</td><td class="n">${p.sets}</td><td class="n">${fmtN(p.topWeight)}</td><td class="n">${fmtN(p.volume, 0)}</td></tr>`).join('')}</table></div>`;

  function progHistory() {

      <p class="sub">${fmtDate(w.startedAt)}, ${fmtTime(w.startedAt)}–${fmtTime(w.endedAt)} — ${esc(w.routineName || '')}${w.routineVersion ? ' v' + w.routineVersion : ''}</p>

  // ======================= ASISTENTE IA =======================
  const AI_SYSTEM = `Sos el asistente de entrenamiento de una app personal de gimnasio. Hablás en español rioplatense, claro y breve.
Reglas obligatorias:
- Usá solo los datos del bloque CONTEXTO. Si algo no está, decí que no hay datos registrados.
- Distinguí explícitamente en tu respuesta entre: "Registrado" (dato del historial), "Sin datos", "Recomendación" y "Estimación".
- Nunca inventes entrenamientos, cargas ni progresos. No afirmes mejoras que los datos no demuestren.
- No diagnostiques ni trates lesiones. Ante dolor, sugerí consultar a un profesional de la salud.
- Para proponer ejercicios usá exclusivamente ids que figuren en EJERCICIOS_DISPONIBLES.
- No digas que aplicaste cambios: la app muestra la propuesta y el usuario decide.
Formato de salida: devolvé SOLO un objeto JSON válido, sin texto extra ni bloques de código:
{"reply":"texto para el usuario","proposal":null}
Si proponés una rutina semanal completa: "proposal":{"type":"routine","name":"...","days":[{"name":"...","weekday":1,"exercises":[{"exId":"...","sets":3,"repMin":8,"repMax":12,"rest":90,"rir":"1-2"}]}]}
Si proponés una sesión puntual para hoy: "proposal":{"type":"session","name":"...","exercises":[{"exId":"...","sets":3,"repMin":8,"repMax":12,"rest":90,"rir":"1-2"}]}
weekday: 1=lunes ... 7=domingo, o null.`;
  const QUICK = ['Tengo 40 minutos, preparame un entrenamiento', 'Quiero priorizar el pecho', 'Analizá mi progreso durante el último mes', 'Compará mi rendimiento actual con el mes pasado', 'Proponé una nueva distribución semanal', 'Ayudame a reorganizar mi rutina sin perder los ejercicios principales'];

  function aiContext(query) {
    const q = query.toLowerCase();
    const wantsHistory = /progres|compar|mes|semana pasada|analiz|mejor|rendimiento|histor|récord|record|estanc|evoluc/.test(q);
    const wantsRoutine = /rutina|distribu|reorganiz|prioriz|reemplaz|alternativ|entrenamiento|minutos|sesi[oó]n|ejercicio|d[ií]as/.test(q) || !wantsHistory;
    const p = S.profile;
    const ctx = { blocks: [], data: {} };
    ctx.data.PERFIL = { edad: p.age, altura_cm: p.height, peso_kg: p.weight ?? 'sin registrar', objetivos_en_orden: p.goals.map((g) => GOALS[g]), experiencia: p.experience, dias_por_semana: p.daysPerWeek, minutos_por_sesion: p.minutes, equipamiento: p.equipment.map((e) => EQUIP[e]), musculos_prioritarios: (p.priorityMuscles || []).map((m) => MUSCLES[m]), ejercicios_excluidos: (p.excluded || []).map((id) => exName(id)), limitaciones_texto: p.limitations || '' };
    ctx.blocks.push('Perfil');
    if (wantsRoutine) {
      const r = activeRoutine();
      ctx.data.RUTINA_ACTIVA = r ? { nombre: r.name, version: r.version, dias: r.days.map((d) => ({ nombre: d.name, weekday: d.weekday, ejercicios: d.exercises.map((it) => ({ exId: it.exId, nombre: exName(it.exId), series: it.sets, reps: `${it.repMin}-${it.repMax}`, descanso_s: it.rest })) })) } : 'Sin rutina activa';
      ctx.data.EJERCICIOS_DISPONIBLES = allExercises().filter((e) => EN.exAvailable(e, p.equipment) && !(p.excluded || []).includes(e.id)).map((e) => `${e.id}|${e.name}|${e.primary}|${e.type === 'c' ? 'compuesto' : 'aislamiento'}`);
      ctx.blocks.push('Rutina activa', 'Lista de ejercicios');
    }
    if (wantsHistory) {
      const days = S.settings.ai.historyDays || 30;
      const from = Date.now() - days * 2 * DAY_MS; // dos períodos para comparar
      ctx.data.HISTORIAL = S.history.filter((w) => w.startedAt >= from).sort((a, b) => a.startedAt - b.startedAt).map((w) => ({ fecha: new Date(w.startedAt).toISOString().slice(0, 10), dia: w.dayName, ejercicios: w.exercises.map((e) => `${e.name}: ${e.sets.map((s) => `${s.w}kg×${s.r}${s.rpe ? '@' + s.rpe : ''}`).join(', ')}`) }));
      ctx.data.HISTORIAL_NOTA = `Registros de los últimos ${days * 2} días (${ctx.data.HISTORIAL.length} sesiones). Antes de eso no se envían datos.`;
      ctx.blocks.push(`Historial ${days * 2} días`);
    }
    return ctx;
  }
  function scrAI() {

        <div class="card"><p><b>El asistente de IA no está configurado.</b></p><p class="muted">Es opcional. Todo lo demás (generador de rutinas, sugerencias de carga, alternativas, estadísticas) funciona sin conexión y sin IA.</p>
        <p class="muted small">Para activarlo necesitás un pequeño servidor intermediario propio (Cloudflare Worker, gratis) que guarde tu clave de API. La clave nunca queda en la app. Las instrucciones están en la guía incluida.</p>

      ${!S.ui.chat.length ? `<p class="sub">Responde con tus datos registrados y propone cambios que vos confirmás. Antes de cada consulta vas a ver qué datos se envían.</p><div class="chips" style="margin-bottom:14px">${QUICK.map((q) => `<button class="chip" data-a="aiQuick" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>` : ''}
      <div class="chat">${msgs}${S.ui.aiBusy ? '<div class="msg ai muted">Pensando…</div>' : ''}</div>
      <div class="composer"><textarea class="input" id="ai-in" placeholder="Escribí tu consulta" rows="1"></textarea><button class="btn primary" data-a="aiSend" ${S.ui.aiBusy ? 'disabled' : ''}>Enviar</button></div>`;

  function renderProposal(p, i) {
    if (p.state === 'applied') return `<div class="proposal"><span class="tag ok">Aplicada</span></div>`;
    if (p.state === 'discarded') return `<div class="proposal"><span class="tag">Descartada</span></div>`;
    const warn = p.dropped && p.dropped.length ? `<p class="small" style="color:#ffb547">Se ignoraron ejercicios desconocidos: ${p.dropped.map(esc).join(', ')}</p>` : '';
    if (p.type === 'session') {
      return `<div class="proposal"><b>Sesión propuesta: ${esc(p.name || 'Entrenamiento')}</b>${warn}<ul>${p.exercises.map((it) => `<li>${esc(exName(it.exId))} ${it.sets}×${it.repMin}–${it.repMax}</li>`).join('')}</ul>
        <p class="small muted">No modifica tu rutina ni tu historial.</p><div class="btns"><button class="btn sm primary" data-a="aiStartSession" data-i="${i}">Iniciar esta sesión</button><button class="btn sm ghost" data-a="aiDiscard" data-i="${i}">Descartar</button></div></div>`;
    }
    const cur = activeRoutine();
    const curIds = new Set(cur ? cur.days.flatMap((d) => d.exercises.map((x) => x.exId)) : []);
    const newIds = new Set(p.days.flatMap((d) => d.exercises.map((x) => x.exId)));
    const removed = [...curIds].filter((id) => !newIds.has(id));
    return `<div class="proposal"><b>Rutina propuesta: ${esc(p.name || 'Nueva rutina')}</b>${warn}
      ${p.days.map((d) => `<div style="margin-top:8px"><b>${esc(d.name)}</b>${d.weekday ? ' — ' + DAYS[d.weekday] : ''}<ul>${d.exercises.map((it) => `<li class="${curIds.has(it.exId) ? '' : 'add'}">${esc(exName(it.exId))} ${it.sets}×${it.repMin}–${it.repMax}${curIds.has(it.exId) ? '' : ' (nuevo)'}</li>`).join('')}</ul></div>`).join('')}
      ${removed.length ? `<p class="small">Sale de la rutina actual: <span class="rem">${removed.map((id) => esc(exName(id))).join(', ')}</span></p>` : ''}
      <p class="small muted">Si la aplicás se guarda como una versión nueva. La rutina actual y tu historial no se modifican.</p>
      <div class="btns"><button class="btn sm primary" data-a="aiApply" data-i="${i}">Aplicar como nueva versión</button><button class="btn sm ghost" data-a="aiDiscard" data-i="${i}">Descartar</button></div></div>`;
  }
  function sanitizeProposal(p) {
    if (!p || typeof p !== 'object') return null;
    const dropped = [];
    const fixItem = (it) => {
      if (!it || !getEx(it.exId)) { if (it && it.exId) dropped.push(String(it.exId)); return null; }
      const clamp = (v, a, b, d) => { v = Math.round(+v); return isFinite(v) ? Math.min(b, Math.max(a, v)) : d; };
      const repMin = clamp(it.repMin, 1, 120, 8), repMax = Math.max(repMin, clamp(it.repMax, 1, 180, 12));
      return { uid: uid(), exId: it.exId, sets: clamp(it.sets, 1, 10, 3), repMin, repMax, rest: clamp(it.rest, 15, 600, 90), rir: String(it.rir || '').slice(0, 10), note: '' };
    };
    if (p.type === 'session' && Array.isArray(p.exercises)) {
      const ex = p.exercises.map(fixItem).filter(Boolean);
      return ex.length ? { type: 'session', name: String(p.name || 'Sesión del asistente').slice(0, 60), exercises: ex, dropped } : null;
    }
    if (p.type === 'routine' && Array.isArray(p.days)) {
      const days = p.days.slice(0, 7).map((d) => ({ id: uid(), name: String(d.name || 'Día').slice(0, 40), weekday: (d.weekday >= 1 && d.weekday <= 7) ? +d.weekday : null, exercises: (d.exercises || []).map(fixItem).filter(Boolean) })).filter((d) => d.exercises.length);
      return days.length ? { type: 'routine', name: String(p.name || 'Rutina del asistente').slice(0, 60), days, dropped } : null;
    }
    return null;
  }
  async function aiSend(text) {
    text = (text || '').trim(); if (!text || S.ui.aiBusy) return;
    const ai = S.settings.ai;
    if (!navigator.onLine) { toast('Sin conexión: el asistente no está disponible.', 'err'); return; }
    const ctx = aiContext(text);
    const preview = `Se enviará a tu servidor (y de ahí al proveedor de IA): ${ctx.blocks.join(', ')}.\n\nNo se envían tu nombre, identificadores del teléfono ni registros fuera de esos bloques.`;
    if (!ai.consent) {
      const ok = await dialog({ title: 'Datos que se envían', text: preview + '\n\nEste aviso aparece una vez; después vas a ver el resumen en cada consulta.', ok: 'Acepto y enviar' });
      if (!ok) return;
      ai.consent = true; save('settings');
    }
    S.ui.chat.push({ role: 'user', text });
    S.ui.chat.push({ role: 'sys', text: 'Enviado: ' + ctx.blocks.join(', ') });
    S.ui.aiBusy = true; render();
    try {
      const history = S.ui.chat.filter((m) => m.role === 'user' || m.role === 'ai').slice(-7, -1).map((m) => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.text }));
      const messages = history.concat([{ role: 'user', content: `CONTEXTO:\n${JSON.stringify(ctx.data)}\n\nCONSULTA:\n${text}` }]);
      const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 60000);
      const res = await fetch(ai.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Access-Key': ai.accessKey || '' }, body: JSON.stringify({ system: AI_SYSTEM, messages, max_tokens: 2000 }), signal: ctrl.signal });
      clearTimeout(to);
      if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error(`El servidor respondió ${res.status}. ${t.slice(0, 160)}`); }
      const data = await res.json();
      const raw = String(data.text || '');
      let parsed = null;
      try { const c = raw.replace(/```json|```/g, '').trim(); const a = c.indexOf('{'), b = c.lastIndexOf('}'); parsed = JSON.parse(c.slice(a, b + 1)); } catch (e) { parsed = null; }
      const reply = parsed && parsed.reply ? String(parsed.reply) : raw || 'Respuesta vacía.';
      const proposal = parsed ? sanitizeProposal(parsed.proposal) : null;
      S.ui.chat.push({ role: 'ai', text: reply, proposal });
    } catch (e) {
      S.ui.chat.push({ role: 'sys', text: 'No se pudo consultar al asistente: ' + (e.name === 'AbortError' ? 'tiempo de espera agotado.' : e.message) + ' Las funciones locales siguen disponibles.' });
    } finally { S.ui.aiBusy = false; render(); }
  }

  async function refreshStorageInfo() {
    const parts = [];

  // ---------- Exportar / importar ----------
  async function shareOrDownload(filename, text, mime) {
    const blob = new Blob([text], { type: mime });
    try {
      const file = new File([blob], filename, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return true; }
    } catch (e) { if (e && e.name === 'AbortError') return false; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return true;
  }
  function exportPayload() {
    const settings = clone(S.settings); settings.ai.accessKey = '';
    return { app: 'personal-gym-coach', schema: 1, appVersion: APP_VERSION, exportedAt: new Date().toISOString(), data: { profile: S.profile, routines: S.routines, customExercises: S.customExercises, history: S.history, active: S.active, settings, bodyweights: S.bodyweights } };
  }
  async function exportJSON() {
    const d = new Date().toISOString().slice(0, 10);
    const ok = await shareOrDownload(`gym-coach-copia-${d}.json`, JSON.stringify(exportPayload(), null, 1), 'application/json');
    if (ok) { S.settings.lastExport = Date.now(); await save('settings'); toast('Copia exportada. Guardala en Archivos o iCloud Drive.', 'ok'); refreshStorageInfo(); render(); }
  }
  async function exportCSV() {
    if (!S.history.length) { toast('No hay entrenamientos para exportar.'); return; }
    const q = (v) => { const s = String(v ?? ''); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const rows = [['fecha', 'hora', 'rutina', 'version', 'dia', 'ejercicio', 'grupo', 'serie', 'peso_kg', 'reps_o_seg', 'rpe', 'volumen_kg', 'reps_min_prog', 'reps_max_prog', 'tecnica_comprometida']];
    S.history.slice().sort((a, b) => a.startedAt - b.startedAt).forEach((w) => w.exercises.forEach((e) => e.sets.forEach((s, i) => {
      const dt = new Date(w.startedAt);
      rows.push([dt.toISOString().slice(0, 10), fmtTime(w.startedAt), w.routineName, w.routineVersion || '', w.dayName, e.name, MUSCLES[e.primary] || '', i + 1, s.w, s.r, s.rpe ?? '', e.unit === 's' ? '' : (s.w || 0) * (s.r || 0), e.planned.repMin, e.planned.repMax, e.techFlag ? 'si' : 'no']);
    })));
    const csv = '\uFEFF' + rows.map((r) => r.map(q).join(';')).join('\n');
    await shareOrDownload(`gym-coach-historial-${new Date().toISOString().slice(0, 10)}.csv`, csv, 'text/csv');

        <div class="stack">${O.edit ? '<button class="btn primary big block" data-a="obFinish" data-v="save">Guardar configuración</button><button class="btn block" data-a="obFinish" data-v="gen">Guardar y generar rutina nueva</button>'
          : '<button class="btn primary big block" data-a="obFinish" data-v="gen">Generar mi rutina</button><button class="btn block" data-a="obFinish" data-v="sample">Empezar con la rutina de ejemplo</button><button class="btn ghost block" data-a="obFinish" data-v="none">Armarla yo desde cero</button>'}</div>`;
    }
    const valid = obValid(O.step, d);
    return `<div class="ob">${prog}<h1>${title}</h1>${sub ? `<p class="muted">${sub}</p>` : ''}<div class="body" style="margin-top:12px">${body}</div>
      <div class="foot"><button class="btn ghost" data-a="obBack">Atrás</button>${step !== 'review' ? `<button class="btn primary" data-a="obNext" ${valid ? '' : 'disabled'}>Siguiente</button>` : ''}</div></div>`;
  }
  async function obFinish(mode) {
    const O = S.ui.ob, d = O.d;
    const prof = { ...d, age: num(d.age), height: num(d.height), weight: d.weight === '' || d.weight == null ? null : num(d.weight) };
    if (prof.weekdays.length !== prof.daysPerWeek) prof.weekdays = EN.resolveWeekdays({ daysPerWeek: prof.daysPerWeek, weekdays: [] });
    const wasNew = !S.profile;
    S.profile = prof; S.ui.ob = null;
    if (wasNew && prof.weight) S.bodyweights.push({ id: uid(), date: Date.now(), kg: prof.weight });
    await save('profile', 'bodyweights');
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { /* */ }
    if (mode === 'gen') { await doGenerate(true); return; }
    if (mode === 'sample') { const r = sampleRoutine(); S.routines.push(r); S.settings.activeRoutineId = r.id; await save('routines', 'settings'); S.ui.tab = 'routines'; S.ui.edit = { srcId: r.id, draft: clone(r) }; toast('Rutina de ejemplo cargada. Editala a tu gusto.'); }
    if (mode === 'none') { S.ui.tab = 'routines'; startNewRoutine(); }
    if (mode === 'save') { S.ui.tab = 'settings'; toast('Configuración guardada.', 'ok'); }
    render();
  }

  // ======================= Acciones de rutinas =======================
  async function doGenerate(activate) {
    const r = EN.generateRoutine(S.profile, allExercises(), S.history);
    S.routines.push(r);
    if (activate || !S.settings.activeRoutineId) S.settings.activeRoutineId = r.id;
    else if (await confirmD('Rutina generada', '¿Querés activarla ahora? La rutina activa actual queda guardada.', 'Activar')) S.settings.activeRoutineId = r.id;
    await save('routines', 'settings');
    S.ui.tab = 'routines'; S.ui.rtab = 'list'; S.ui.edit = { srcId: r.id, draft: clone(r) };
    toast('Rutina generada. Revisala y editala libremente.', 'ok');
    render();
  }
  function startNewRoutine() {
    S.ui.edit = { srcId: null, draft: { id: uid(), name: 'Mi rutina', version: 1, parentId: null, createdAt: Date.now(), updatedAt: Date.now(), source: 'manual', days: [{ id: uid(), name: 'Día 1', weekday: null, exercises: [] }] } };
    S.ui.tab = 'routines'; S.ui.edit.dirty = true;
  }
  async function saveEditor(asVersion) {
    const E = S.ui.edit; const d = E.draft;
    if (!d.name.trim()) { toast('Poné un nombre a la rutina.', 'err'); return; }
    if (S.active && E.srcId && S.active.routineId === E.srcId) {
      const ok = await confirmD('Hay un entrenamiento en curso', 'Estás editando la rutina del entrenamiento en curso. La sesión en curso conserva su plan original; los cambios se aplican desde el próximo entrenamiento.', 'Guardar igual');
      if (!ok) return;
    }
    d.days.forEach((day) => day.exercises.forEach((it) => { it.repMax = Math.max(it.repMin, it.repMax); it.sets = Math.max(1, it.sets); }));
    delete d.warnings;
    if (!E.srcId) { d.updatedAt = Date.now(); S.routines.push(d); if (!S.settings.activeRoutineId) S.settings.activeRoutineId = d.id; }
    else if (asVersion) {
      const src = S.routines.find((r) => r.id === E.srcId);
      const nv = newRoutineVersion({ ...d, id: src.id, version: src.version });
      S.routines.push(nv);
      if (S.settings.activeRoutineId === src.id) S.settings.activeRoutineId = nv.id;
    } else {
      const i = S.routines.findIndex((r) => r.id === E.srcId);
      d.updatedAt = Date.now(); S.routines[i] = d;
    }
    await save('routines', 'settings');
    S.ui.edit = null; toast(asVersion ? 'Guardada como versión nueva.' : 'Rutina guardada.', 'ok'); render();
  }

  // ======================= Acciones del entrenamiento =======================
  function curEx() { return S.active ? S.active.exercises[S.active.cur || 0] : null; }
  function readRow(i) {
    const row = document.querySelector(`.set[data-row="${i}"]`);
    if (!row) return null;
    const g = (f) => { const el = row.querySelector(`[data-f="${f}"]`); return el ? el.value : ''; };
    return { w: num(g('w')), r: num(g('r')), rpe: num(g('rpe')) };
  }
  async function finishWorkout() {
    const A = S.active;
    const done = A.exercises.filter((e) => e.sets.some(Boolean));
    if (!done.length) {
      if (await confirmD('Sin series registradas', 'No registraste ninguna serie. ¿Descartar el entrenamiento?', 'Descartar', true)) { S.active = null; await save('active'); releaseWakeLock(); S.ui.tab = 'home'; render(); }
      return;
    }
    const pending = A.exercises.reduce((t, e) => t + Math.max(0, e.planned.sets - e.sets.filter(Boolean).length), 0);
    if (!(await confirmD('Finalizar entrenamiento', pending ? `Quedan ${pending} series programadas sin registrar. Se guardará solo lo realizado.` : 'Se guardará el entrenamiento en tu historial.', 'Finalizar'))) return;
    const rec = {
      id: A.id, routineId: A.routineId, routineName: A.routineName, routineVersion: A.routineVersion, dayId: A.dayId, dayName: A.dayName,
      startedAt: A.startedAt, endedAt: Date.now(),
      exercises: done.map((e) => ({ exId: e.exId, name: e.name, primary: e.primary, unit: e.unit, planned: e.planned, sets: e.sets.filter(Boolean).map((s) => ({ w: s.w, r: s.r, rpe: s.rpe ?? null, ts: s.ts, ...(s.editedAt ? { editedAt: s.editedAt } : {}) })), techFlag: !!e.techFlag, replacedFrom: e.replacedFrom, suggestion: e.suggestion ? { type: e.suggestion.type, weight: e.suggestion.weight, decision: e.sugDecision, chosen: e.sugWeight } : null }))
    };
    S.history.push(rec); S.active = null;
    await save('history', 'active');
    releaseWakeLock();
    S.ui.summaryId = rec.id; S.ui.recovered = false; render();
  }

    },

    },

        <button class="item" data-a="dayDup" data-d="${di}"><div class="grow t">Duplicar día</div></button><button class="item" data-a="dayDel" data-d="${di}"><div class="grow t" style="color:#ff8a8f">Eliminar día</div></button></div>` }));

    async dayDel(el) { closeSheet(); if (!(await confirmD('Eliminar día', 'Se quitará el día y sus ejercicios de esta rutina.', 'Eliminar', true))) return; S.ui.edit.draft.days.splice(+el.dataset.d, 1); S.ui.edit.dirty = true; render(); },
    addDay() { const d = S.ui.edit.draft; d.days.push({ id: uid(), name: 'Día ' + (d.days.length + 1), weekday: null, exercises: [] }); S.ui.edit.dirty = true; render(); },
    pickEx(el) { S.ui.pick = { d: +el.dataset.d, q: '', m: '', onlyAvail: true }; openSheet(pickerSheet); },

    goEx(el) { const i = +el.dataset.i; if (i < 0 || i >= S.active.exercises.length) return; S.active.cur = i; saveActiveSoon(); render(); },
    async confirmSet(el) {
      const i = +el.dataset.i; const e = curEx(); const v = readRow(i);
      if (!v || v.r == null || v.r <= 0) { toast(`Ingresá las ${e.unit === 's' ? 'segundos' : 'repeticiones'} realizadas.`, 'err'); return; }
